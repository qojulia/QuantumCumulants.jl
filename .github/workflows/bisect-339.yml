name: Bisect #339 SymbolicUtils memo fix

on:
  push:
    branches:
      - ci/bisect-339-dependencies

jobs:
  memo-fix:
    name: SymbolicUtils memo experiment (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: upstream-master
            patch: 'false'
          - variant: reusable-task-memo
            patch: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - name: Resolve current SymbolicUtils master
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: |
          julia --project=. - <<'JULIA'
          using Pkg
          Pkg.instantiate()
          Pkg.add(PackageSpec(url = "https://github.com/JuliaSymbolics/SymbolicUtils.jl", rev = "f5358a3c47b525ff7e686b7671e6b904964fbdc3"))
          JULIA

      - name: Run equality and allocation checks
        env:
          PATCH_MEMO: ${{ matrix.patch }}
          BISECT_VARIANT: ${{ matrix.variant }}
        run: |
          julia --project=. - <<'JULIA'
          using QuantumCumulants
          using SymbolicUtils: SymbolicUtils
          using Test

          if ENV["PATCH_MEMO"] == "true"
              @eval SymbolicUtils begin
                  # Diagnostic prototype: preserve #1052's memoized traversal, but reuse
                  # one dictionary per task instead of allocating a new one for every
                  # outer BasicSymbolic equality comparison.
                  const REUSABLE_EQUALITY_MEMO =
                      TaskLocalValue{Dict{Tuple{UInt, UInt, Bool}, Bool}}(
                          Dict{Tuple{UInt, UInt, Bool}, Bool}
                      )

                  function Base.isequal(a::BSImpl.Type, b::BSImpl.Type)
                      a === b && return true
                      ida = a.id
                      idb = b.id
                      ida === idb && ida !== nothing && return true

                      Ta = MData.variant_type(a)
                      Tb = MData.variant_type(b)
                      Ta === Tb || return false

                      EQUALITY_MEMO[] === nothing ||
                          return isequal_bsimpl(a, b, COMPARE_FULL[])

                      memo = REUSABLE_EQUALITY_MEMO[]
                      empty!(memo)
                      EQUALITY_MEMO[] = memo
                      try
                          return isequal_bsimpl(a, b, COMPARE_FULL[])
                      finally
                          EQUALITY_MEMO[] = nothing
                          empty!(memo)
                      end
                  end
              end
          end

          # Exact reproducer shape from SymbolicUtils #1049: a depth-n DAG in which
          # `e` is shared by both factors. Metadata keeps the roots distinct while
          # ordinary equality intentionally ignores it.
          struct EqualityMemoTag end
          SymbolicUtils.@syms equality_x::Real equality_y::Real
          function deep_equality_dag(leaf, n)
              e = leaf
              for i in 1:n
                  e = (e + i) * (e + equality_y)
              end
              return e
          end
          equality_tagged = SymbolicUtils.setmetadata(equality_x, EqualityMemoTag, 1)
          dag_a = deep_equality_dag(equality_x, 100)
          dag_b = deep_equality_dag(equality_tagged, 100)
          @test isequal(dag_a, dag_b)
          dag_time = @elapsed @test isequal(dag_a, dag_b)
          println("#1049 DAG depth=100 isequal time: ", dag_time, " s")

          phase_invariant(x) = iszero(_net_phase(x))
          _net_phase(_) = 0
          function _net_phase(op::Op)
              is_destroy(op) && return -1
              is_create(op) && return 1
              return is_transition(op) ? op.l1 - op.l2 : 0
          end
          _net_phase(t::QuantumCumulants.SecondQuantizedAlgebra.QTerm) =
              isempty(t.ops) ? 0 : sum(_net_phase(op) for op in t.ops)
          function _net_phase(q::QuantumCumulants.SecondQuantizedAlgebra.QAdd)
              isempty(q.arguments) && return 0
              term, _ = first(q.arguments)
              return _net_phase(term)
          end
          function _net_phase(avg::SymbolicUtils.BasicSymbolic)
              is_average(avg) || return 0
              return _net_phase(undo_average(avg))
          end

          println("memo experiment variant: ", ENV["BISECT_VARIANT"])
          include("test/allocations/allocation_test.jl")
          JULIA
