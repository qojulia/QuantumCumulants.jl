name: Bisect #339 SymbolicUtils commit

on:
  push:
    branches:
      - ci/bisect-339-dependencies

jobs:
  allocation-bisect:
    name: SymbolicUtils bisect (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: after-seed-fix-510356
            rev: 510356e9e1f0d88327dbb96574aed44a2c2a02fb
          - variant: before-equality-memo-7422fb
            rev: 7422fb28a1ed60618bd8559d6b52a036b1d223bf
          - variant: equality-memo-748075
            rev: 748075182f48408d6159b1a6e077cbb55921d695
          - variant: after-hash-revert-1acbc2
            rev: 1acbc24dc8e26a8fb369be7efa71ed1b23ce23cc
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - name: Resolve SymbolicUtils revision
        env:
          SU_REV: ${{ matrix.rev }}
          BISECT_VARIANT: ${{ matrix.variant }}
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: |
          julia --project=. - <<'JULIA'
          using Pkg
          Pkg.instantiate()
          Pkg.add(PackageSpec(url = "https://github.com/JuliaSymbolics/SymbolicUtils.jl", rev = ENV["SU_REV"]))

          wanted = Set(["SymbolicUtils", "ModelingToolkitBase", "SciMLBase", "Symbolics"])
          println("resolved dependency set for ", ENV["BISECT_VARIANT"])
          for dep in sort!(collect(values(Pkg.dependencies())); by = x -> x.name)
              dep.name in wanted || continue
              println("  ", dep.name, " = ", dep.version, " tree=", dep.tree_hash)
          end
          JULIA

      - name: Run allocation regression gate
        env:
          BISECT_VARIANT: ${{ matrix.variant }}
        run: |
          julia --project=. - <<'JULIA'
          using QuantumCumulants
          using SymbolicUtils: SymbolicUtils
          using Test

          phase_invariant(x) = iszero(_net_phase(x))
          _net_phase(_) = 0
          function _net_phase(op::Op)
              is_destroy(op) && return -1
              is_create(op) && return 1
              return is_transition(op) ? op.l1 - op.l2 : 0
          end
          _net_phase(t::QuantumCumulants.SecondQuantizedAlgebra.QTerm) =
              isempty(t.ops) ? 0 : sum(_net_phase(op) for op in t.ops)
          function _net_phase(q::QuantumCumulants.SecondQuantizedAlgebra.QAdd)
              isempty(q.arguments) && return 0
              term, _ = first(q.arguments)
              return _net_phase(term)
          end
          function _net_phase(avg::SymbolicUtils.BasicSymbolic)
              is_average(avg) || return 0
              return _net_phase(undo_average(avg))
          end

          println("allocation bisect variant: ", ENV["BISECT_VARIANT"])
          include("test/allocations/allocation_test.jl")
          JULIA
